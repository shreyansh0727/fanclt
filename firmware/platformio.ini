; FanCtl 8-channel relay controller - Waveshare ESP32-C6-Pico
; (ESP32-C6-MINI-1 module, 4 MB flash, native USB-JTAG on the USB-C port)
;
; Build:  pio run -t upload --upload-port COMx
; Monitor: pio device monitor --port COMx
; If the board does not auto-reset into download mode, hold BOOT (GP9)
; while tapping RESET.

[env:esp32-c6-pico]
platform = espressif32@8.0.0
board = esp32-c6-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
; Two 1.5 MB app slots + otadata: the default 1.25 MB slot and huge_app.csv's
; single 3 MB slot both leave no room for an OTA image.
board_build.partitions = partitions.csv
; Serial console runs over the native USB-CDC (the board has no USB-UART bridge).
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -Wall
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    dfrobot/DFRobotDFPlayerMini@^1.0.6
    olikraus/U8g2@^2.36.4
